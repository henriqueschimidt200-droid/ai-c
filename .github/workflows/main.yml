name: AI Creator - GERAR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Gerar APK
    runs-on: ubuntu-22.04

    steps:

      # =====================================================
      # 1. BAIXAR O PROJETO
      # =====================================================
      - name: Baixar projeto
        uses: actions/checkout@v4

      # =====================================================
      # 2. JAVA
      # =====================================================
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =====================================================
      # 3. FLUTTER
      # =====================================================
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # =====================================================
      # 4. VERIFICAR AMBIENTE
      # =====================================================
      - name: Verificar ambiente
        run: |
          echo "================================"
          echo "AI CREATOR - AMBIENTE"
          echo "================================"

          java -version

          echo ""
          flutter --version

          echo ""
          dart --version

          echo ""
          echo "Arquivos do projeto:"
          ls -la

          if [ ! -f pubspec.yaml ]; then
            echo ""
            echo "ERRO: pubspec.yaml não encontrado."
            exit 1
          fi

          echo ""
          echo "OK: projeto Flutter encontrado."

      # =====================================================
      # 5. CRIAR ANDROID MODERNO
      # =====================================================
      - name: Preparar Android
        run: |
          echo "Verificando Android..."

          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then

            echo "Android não encontrado."
            echo "Criando Android moderno..."

            rm -rf android

            flutter create \
              --platforms=android \
              --android-language kotlin \
              --org com.aicreator \
              --project-name ai_creator \
              .

          else

            echo "Android já existe."

          fi

          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            echo "ERRO: AndroidManifest.xml não foi criado."
            exit 1
          fi

          echo "Android OK."

      # =====================================================
      # 6. NOME DO APLICATIVO
      # =====================================================
      - name: Configurar nome AI Creator
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          file = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = file.read_text()

          text = re.sub(
              r'android:label="[^"]*"',
              'android:label="AI Creator"',
              text,
              count=1
          )

          if 'android:label="AI Creator"' not in text:
              text = text.replace(
                  "<application ",
                  '<application android:label="AI Creator" ',
                  1
              )

          file.write_text(text)

          print("Nome configurado: AI Creator")
          PY

      # =====================================================
      # 7. DEPENDÊNCIAS
      # =====================================================
      - name: Instalar dependências
        run: |
          flutter clean
          flutter pub get

      # =====================================================
      # 8. DIAGNÓSTICO DO DART
      # =====================================================
      - name: Verificar código Dart
        id: dart
        continue-on-error: true
        run: |
          set +e

          flutter analyze 2>&1 | tee analyze.log

          CODE=${PIPESTATUS[0]}

          echo "DART_EXIT=$CODE" >> "$GITHUB_ENV"

          exit $CODE

      # =====================================================
      # 9. MOSTRAR ERRO DART
      # =====================================================
      - name: Relatório de erro Dart
        if: steps.dart.outcome != 'success'
        run: |
          echo ""
          echo "=============================================="
          echo "❌ ERRO NO CÓDIGO DART"
          echo "=============================================="
          echo ""

          if [ -f analyze.log ]; then
            cat analyze.log
          fi

          echo ""
          echo "=============================================="
          echo "O APK NÃO será compilado enquanto esse erro"
          echo "não for corrigido."
          echo "=============================================="

      # =====================================================
      # 10. COMPILAR APK
      # =====================================================
      - name: Gerar APK
        id: apk
        if: steps.dart.outcome == 'success'
        continue-on-error: true
        run: |
          set +e

          flutter build apk --release 2>&1 | tee build.log

          CODE=${PIPESTATUS[0]}

          echo "APK_EXIT=$CODE" >> "$GITHUB_ENV"

          exit $CODE

      # =====================================================
      # 11. DIAGNÓSTICO DO APK
      # =====================================================
      - name: Diagnóstico final
        if: always()
        run: |
          echo "# 🤖 AI Creator - Diagnóstico" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${DART_EXIT:-1}" != "0" ]; then

            echo "## ❌ ERRO NO CÓDIGO DART" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "O Flutter encontrou um erro antes de tentar criar o APK." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 analyze.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"

          elif [ "${APK_EXIT:-1}" != "0" ]; then

            echo "## ❌ ERRO NA GERAÇÃO DO APK" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "O código Dart passou, mas o Android/Gradle falhou." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 150 build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"

          else

            echo "## ✅ APK GERADO COM SUCESSO" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**AI Creator** está pronto." >> "$GITHUB_STEP_SUMMARY"

          fi

      # =====================================================
      # 12. SALVAR LOGS
      # =====================================================
      - name: Salvar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Creator-Diagnostico
          path: |
            analyze.log
            build.log
          if-no-files-found: ignore

      # =====================================================
      # 13. DISPONIBILIZAR APK
      # =====================================================
      - name: Disponibilizar APK
        if: env.APK_EXIT == '0'
        uses: actions/upload-artifact@v4
        with:
          name: AI-Creator-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # =====================================================
      # 14. FINAL
      # =====================================================
      - name: Resultado
        if: always()
        run: |
          if [ "${APK_EXIT:-1}" = "0" ]; then
            echo ""
            echo "=============================================="
            echo "✅ AI CREATOR APK GERADO"
            echo "=============================================="
            echo ""
            echo "Baixe em:"
            echo "Artifacts -> AI-Creator-APK"
          else
            echo ""
            echo "=============================================="
            echo "❌ APK NÃO FOI GERADO"
            echo "=============================================="
            echo ""
            echo "Baixe:"
            echo "Artifacts -> AI-Creator-Diagnostico"
            echo ""
            echo "O relatório mostra exatamente onde ocorreu"
            echo "o problema."
          fi
